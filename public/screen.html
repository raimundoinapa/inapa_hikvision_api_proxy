<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="title" content="INAPA - Sistema de Monitoreo">
    <meta name="description" content="INAPA - Sistema de Monitoreo">
    <meta name="keywords" content="INAPA - Sistema de Monitoreo">

    <meta name="language" content="Spanish">

        <!-- CPLIb -->
        <link href="./cp_lib_v0.2.0/css/helper.css" rel="stylesheet">
        <script src="./cp_lib_v0.2.0/js/helper.js"></script>
        <script src="./cp_lib_v0.2.0/js/custom-elements.js"></script>
        <script src="./cp_lib_v0.2.0/js/web-components.js"></script>

        #camera {
            height: 100%;
        }
    </style> -->

    <title>Screen</title>
</head>
<body>
    <main>
        <br>
        <div is="super-form" class="container">
            <div class="d-flex-center gap1">
                <h1 class="h5"></h1>
                <div class="form-row mb0">
                    <select name="client-select">
                        <option value="" selected>Selecciona</option>
                    </select>
                    <label for="client-select" class="label-placeholder">Clientes</label>
                </div>
            </div>
        </div>
        <br>
        <div id="camera" class="d-flex-center">
            <div id="jsPluginGridContainer"></div>
        </div>
    </main>
</body>
<script>
    (async () => {
        const {app, q, select, create, sleep, runFetch, dbExists, dbStart, getISO8601Timestamp, enableForm, disableForm} = __CPLIB__;

        const showSnackbar = function(msg = '', severity = 'info', duration = '') {
            const sb = create('a-dialog', {
                snackbar: duration, 'snackbar-progress' : '', 'self-destroy': '', bottom: '', right: '', transition: 'swipe-up', state: 'active'
            }, {innerHTML: msg});

            const attr = {};
            attr[severity] = '';

            sb.setAttr = attr;
            
            document.body.appendChild(sb);
        }

        const addDblTapListener = (element, dblTapFnc) => {
            let lastTap = 0;
            const doubleTapDelay = 300;//ms

            element.addEventListener('touchstart', function(e) {
                const currentTime = new Date().getTime();
                const tapGap = currentTime - lastTap;

                if (tapGap < doubleTapDelay && tapGap > 0) {
                    e.preventDefault();//Evita que haga zoom
                    
                    dblTapFnc(e);
                }

                lastTap = currentTime;
            });
        }

        const isFullscreen = () => {
            return ['fullscreenElement', 'webkitFullscreenElement', 'mozFullScreenElement', 'msFullscreenElement'].some(f => document?.[f]);
        }

        const exitFullscreenFnc = () => {
            const efsFnc = ['exitFullscreen', 'webkitExitFullscreen', 'mozExitFullscreen', 'msExitFullscreen'].filter(f => document?.[f])?.[0];

            if (document?.[efsFnc]) { document[efsFnc](); }
            
            return true;
        }

        const enterFullscreen = (evt) => {
            const elemFullscreenProp = ['requestFullscreen', 'webkitRequestFullscreen', 'mozRequestFullscreen', 'msRequestFullscreen'].filter(f => evt.target?.[f])?.[0];

            if (! isFullscreen()) {
                if (elemFullscreenProp) {
                    evt.target[elemFullscreenProp]();
                }
            } else {
                exitFullscreenFnc();
            }
        }

        const getScreenSize = () => {
            const div = create('div', false, {style: {position: 'absolute', visibility: 'hidden', overflow: 'scroll', width: '100%'}});

            document.body.appendChild(div);
        
            const width = div.clientWidth;
            const height = Math.floor((width) / (16/9));
            
            div._remove();

            return {width, height};
        };

        const screenSize = getScreenSize();

        const jsDecoder = await new JSPlugin({
            szId: 'jsPluginGridContainer',
            iWidth: screenSize.width,
            iHeight: screenSize.height,
            iMaxSplit: 1,
            iCurrentSplit: 1,
            szBasePath: "/jsplugin",
            /* oStyle: {
                border: "#343434",
                borderSelect: "red",
                background: "#4C4B4B"
            } */
        });
        const jsDecoderFullscreen = () => {
            jsDecoder.JS_FullScreenDisplay(true).then(function () {
                console.log("JS_FullScreenDisplay success");
            }, function () {
                console.log("JS_FullScreenDisplay failed");
            });
        }
        const videoPlayerContainer = select('[id^="jsPluginGridContainerplayer-container"]') || {};
        const jqObj = Object.keys(videoPlayerContainer)?.[0];

        if (jqObj) {
            console.log(jqObj, videoPlayerContainer[jqObj]);

            delete videoPlayerContainer[jqObj];

            //videoPlayerContainer._on('dblclick', enterFullscreen);
            //addDblTapListener(videoPlayerContainer, enterFullscreen);

            videoPlayerContainer._on('dblclick', jsDecoderFullscreen);
            addDblTapListener(videoPlayerContainer, jsDecoderFullscreen);
        }

        const clientSelectBox = select('[name="client-select"]');
        //Clave de pantalla: /screen?key=... (se reenvía a los endpoints de pantalla)
        const screenKey = new URLSearchParams(window.location.search).get('key') || '';
        const screenKeyQuery = screenKey ? `&key=${encodeURIComponent(screenKey)}` : '';
        const screenKeyParam = screenKey ? `?key=${encodeURIComponent(screenKey)}` : '';
        const eventSource = new EventSource(`/sse_events?isScreen=true${screenKeyQuery}`);
        let screenId = 0;

        eventSource.addEventListener("message", async (e) => {
            let response = {};
            
            try {
                response = JSON.parse(e.data);
            } catch (err) {
                console.log(err);
            } finally {}

            if (! Object.keys(response) || ! response?.event) { return; }

            if ('connect' == response.event && response?.data) {
                screenId = response.data;

                const idParts = screenId.split('-');

                q('h1').innerText = `Pantalla ${idParts[idParts.length - 1]}`;

                console.log('Conectado al servidor');
                
                return;
            }

            if ('update' == response.event) {
                jsDecoder.JS_Stop(0).then(function () {
                    console.log("stop success");
                }, function () {
                    console.log("stop failed");
                });

                if (response?.data?.streamUrl) {
                    jsDecoder.JS_Play(response.data.streamUrl, {
                        playURL: response.data.streamUrl,
                        auth: '',
                        mode: 'media',
                        token: '',
                    }, 0).then(async () => {
                        /*jsDecoder.JS_FullScreenSingle(0).then(function () {
                            console.log("JS_FullScreenSingle success");
                        }, function () {
                            console.log("JS_FullScreenSingle failed");
                        });*/

                        showSnackbar(`Transmisión iniciada`, 'success');
                    }, () => {
                        showSnackbar(`No se pudo inicar la transmisión de la cámara`, 'warning');
                    });
                }
            }
        });

        eventSource.addEventListener("error", (e) => {
            console.log('Error de conexión - reconectando', e);
        });

        window.onresize = function () {
            const screenSize = getScreenSize();

            jsDecoder.JS_Resize(`${screenSize.width}`, `${screenSize.height}`).then(function () {
                console.log("JS_Resize success");
            }, function () {
                console.log("JS_Resize failed");
            });
        }

        const clientIds = await runFetch(`/get_clients${screenKeyParam}`, {method: 'get'});

        if (clientIds?.data?.length) {
            clientIds.data.forEach((f) => {
                clientSelectBox.appendChild(create('option', false, {value: f, innerText: f}));
            });
        }
        
        clientSelectBox._on('change', async (evt) => {
            if (! clientSelectBox.value) { return false; }

            const clientConnect = await runFetch(`/connect_client${screenKeyParam}`, {method: 'post', body: JSON.stringify({clientId: clientSelectBox.value, screenId})});

            if (! clientConnect?.ok) {
                showSnackbar(clientConnect?.data?.message || 'Error', 'warning');

                return;
            }

            showSnackbar('Cliente conectado satisfactoriamente', 'success');
        });
    })();
</script>
</html>
