<html lang="es">
    <head>

        <meta name="description" content="INAPA - Sistema de Monitoreo">
        <meta name="keywords" content="INAPA - Sistema de Monitoreo">
        <meta name="robots" content="index, follow">
        <meta name="language" content="Spanish">

        <style>
            :root {
                --gap: 10px;
            }

            .global-preloader {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: var(--bg-color-1);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 9999;
            }
                .global-preloader::after {
                    content: "";
                    height: 40px;
                    aspect-ratio: 1 / 1;
                    border-width: 7px;
                    border-style: solid;
                    border-color: inherit;
                    border-top-color: transparent;
                    border-bottom-color: transparent;
                    border-radius: 50%;
                    animation: rotate 1s linear infinite;
                }
            
            #logo {
                position: absolute;
                z-index: 1005;
            }

            #status {
                float: right;
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
                align-items: flex-end;
            }
                #status span {
                    font-size: 0.8rem;
                }
            
            #tools-form { padding-top: 0.5rem; }

            #camera-grid {
                display: grid;
                gap: var(--gap);
                overflow: hidden;
            }
                .grid-4x4 { grid-template-columns: repeat(auto-fit, minmax(calc((var(--max-width) - (var(--padding) * 2) - (var(--gap) * 3)) / 4), 1fr)); }
                .grid-3x3 { grid-template-columns: repeat(auto-fit, minmax(calc((var(--max-width) - (var(--padding) * 2) - (var(--gap) * 2)) / 3), 1fr)); }
                .grid-2x2 { grid-template-columns: repeat(auto-fit, minmax(calc((var(--max-width) - (var(--padding) * 2) - (var(--gap) * 1)) / 2), 1fr)); }
                .grid-1x1 { grid-template-columns: repeat(auto-fit, minmax(calc((var(--max-width) - (var(--padding) * 2) - (var(--gap) * 0)) / 1), 1fr)); }

            .video-player-wrapper {
                position: relative;
                aspect-ratio: 16 / 9;
                color: var(--bg-color-3);
                background-color: var(--bg-color-3);
            }
                .video-player-wrapper .preloader { color: var(--text-color-1); }
                .video-player-container { background-size: cover; }
                .video-controls,
                .camera-status-container,
                .camera-name-container,
                .stream-error-msg-container {
                    position: absolute;
                    overflow: visible;
                    padding: 10px;
                }
                .camera-name,
                .stream-error {
                    color: var(--bg-color-1);
                    text-shadow: 0 0 5px var(--text-color-1), 
                        0 0 5px var(--text-color-1), 
                        0 0 5px var(--text-color-1);
                }
                
                .refresh-btn-container {
                    position: absolute;
                    top: 10px;
                    right: 2.5rem;
                    z-index: 1000;
                    opacity: 0;
                }

                .video-controls {
                    bottom: 0;
                    left: 0;
                    z-index: 1000;
                    opacity: 0;
                }
                    .video-controls .buttons {
                        position: relative;
                        display: flex;
                        gap: 1rem;
                    }

                .video-player-wrapper:hover .refresh-btn-container,
                .video-player-wrapper:hover .video-controls {
                    opacity: 1;
                }

                .camera-status-container {
                    bottom: 0;
                    right: 0;
                    display: flex;
                    justify-content: flex-end;
                    z-index: 999;
                }

                .camera-name-container {
                    top: 0;
                    left: 0;
                    display: flex;
                    justify-content: flex-end;
                    z-index: 999;
                }
                    .camera-name-container .small { font-size: 0.7rem; }
                
                .stream-error-msg-container {
                    top: calc(50% - 1rem);
                    left: 1rem;
                    z-index: 999;
                }

                .video-player-container {
                    position: relative;
                    height: 100%;
                }
                    .video-player-container [id^="video-player"] {
                        width: 100% !important;
                        height: 100% !important;
                        border: none !important;
                    }

            @media screen and (max-width: 1174px) {
                #logo {
                    top: 12px;
                }

                #tools-form { flex-direction: column; }

                #status {
                    float: none;
                    align-items: center;
                    padding-top: 12px;
                }
            }

            #camera-grid-wrapper:-webkit-full-screen {
                --max-width: 1536px;/*Resolución 1920x1080 con un Scale de 125%*/
                --padding: 0px;
                --gap: 0px;
            }
                #camera-grid-wrapper:-webkit-full-screen .video-player-container {
                    border: 1px solid rgba(255, 255, 255, .5);
                }

            #camera-grid-wrapper:-moz-full-screen {
                --max-width: 1536px;
                --padding: 0px;
                --gap: 0px;
            }
                #camera-grid-wrapper:-moz-full-screen .video-player-container {
                    border: 1px solid rgba(255, 255, 255, .5);
                }

            #camera-grid-wrapper:-ms-full-screen {
                --max-width: 1536px;
                --padding: 0px;
                --gap: 0px;
            }
                #camera-grid-wrapper:-ms-full-screen .video-player-container {
                    border: 1px solid rgba(255, 255, 255, .5);
                }
        </style>

        <title>INAPA - Sistema de Monitoreo</title>
    </head>
    <body>
        <div class="global-preloader"></div>
        <main>
            <div class="container">
                <h1 id="logo" class="m0 p0"><img src="./img/logo.png" alt="Logo INAPA" width="75px"><span class="d-none">INAPA - Sistema de Monitoreo</span></h1>

                <div id="status">
                    <div>
                        <dark-mode-toggler icon-size="1.5em"></dark-mode-toggler>
                    </div>
                    <div>
                        <a-badge success pill id='online-badge'>12 Online</a-badge> <a-badge danger pill id='offline-badge'>2 Offline</a-badge> <a-badge info pill id='total-badge'>12 Total</a-badge>
                    </div>
                </div>

                <form action="/test" method="post" id="tools-form" is="super-form" novalidate="" class="d-flex-center gap0-5 mt1">
                    <div class="d-flex-center gap0-5 mb1">
                        <div class="form-row mb0">
                            <div class="d-flex gap0-5">
                                <div class="p-relative">
                                    <!-- Lupa -->
                                    <!-- <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>0 -->
                                    <input type="text" name="search" placeholder="Buscar (Keywords separados por ,)" title="Buscar (Keywords separados por ,)" style="width: 280px;">
                                    <label class="label-placeholder">Buscar (Keywords separados por ,)</label></div>
                                <div>
                                <a-button info type="submit" name="search-button"><an-icon search size="1.2em"></an-icon></a-button></div>
                            </div>
                        </div>
                        <!-- <div><a-button info><an-icon grid size="1.2em"></an-icon></a-button></div>
                        <div><a-button info>᎒᎒᎒</a-button></div>
                        <div><a-button info>⋮⋮⋮</a-button></div> -->
                    </div>
                    <div class="d-flex-center gap0-5 mb1">
                        <div class="form-row mb0">
                            <select name="status-select"></select>
                            <label class="label-placeholder">Status</label>
                        </div>
                        <div class="o-visible" style="width: 41px; height: 40px;">
                            <a-button info aria-label="Filtro" aria-controls="filters-dialog" data-filter-set="false">
                                <style>
                                    :host([data-filter-set="false"]) span { display: none; }
                                </style>
                                <an-icon filter size="1.2em"></an-icon>
                                <span class="p-absolute h5" style="color: var(--danger-1)">*</span>
                            </a-button>
                        </div>
                        <!-- <div><a-button id="btn-custom-view" info aria-label="Custom view" style="width: 41px; height: 40px;">᎒᎒᎒</a-button></div> -->
                        <div class="form-row mb0">
                            <select name="sort-select"></select>
                            <label class="label-placeholder">Ordenar por</label>
                        </div>
                    </div>
                    <div class="d-flex-center gap0-5 mb1">
                        <div class="form-row mb0">
                            <select name="grid-size-select">
                            </select>
                            <label class="label-placeholder">Tamaño</label>
                        </div>
                        <div><a-button id="btn-start-all" success aria-label="Iniciar todo">▶ <span class="d-none">Iniciar todo</span></a-button></div>
                        <div><a-button id="btn-stop-all" danger aria-label="Detener todo">⏹ <span class="d-none">Detener todo</span></a-button></div>
                        <div><a-button id="btn-fullscreen-all" warning aria-label="Fullscreen"><an-icon full-screen></an-icon></a-button></div>                        
                        <div><a-button id="btn-refresh-all" info aria-label="Refresh"><an-icon refresh size="1.2em"></an-icon></a-button></div>
                    </div>
                </form>
            </div>

            <div id="camera-grid-wrapper">
                <div class="container">
                    <div id="camera-grid" class="grid-4x4"></div>
                </div>
            </div>
            
            <div class="container mt1">
                <div id="pagination"></div>
            </div>
        </main>

        <a-dialog id="filters-dialog" menu class="protected-from-dark" transition='swipe-down' width="400px">
            <style>
                :where([is="super-form"]) fieldset {
                    padding: 5px;
                    margin-bottom: 10px;
                    border: none;
                    border-radius: 0;
                    font-size: 0.85rem;
                }
                :where([is="super-form"]) > div > fieldset { flex: 1;}
                :where([is="super-form"]) fieldset legend {
                    padding: 0;
                    margin-bottom: 0;
                    font-size: 0.85rem;
                }
                :where([is="super-form"]) .form-row {
                    max-height: 150px;
                    padding: 10px;
                    border-radius: 5px;
                    overflow-y: auto;
                    background-color: var(--white-smoke);
                }
                :where([is="super-form"]) .form-row > div {
                    display: flex;
                    align-items: center;
                    gap: 10px;
                }
                :where([is="super-form"]) .form-row:not(.mb0) {
                    margin-bottom: 5px;
                }
                legend > div { float: right; }
            </style>

            <form action="#" method="post" data-bind="filters-form" is="super-form" novalidate="" class="mb0" id="filters-form">
                <fieldset>
                    <legend class="w100">Favoritos <a-badge info data-bind="favorites-count">1</a-badge> <div>Selected <a-badge success data-bind="favorites-selected-count">0</a-badge></div></legend>
                    <div class="form-row" data-bind="favorites-container"></div>
                </fieldset>
                
                <fieldset>
                    <legend class="w100">Capabilities <a-badge info data-bind="capabilities-count">0</a-badge> <div>Selected <a-badge success data-bind="capabilities-selected-count">0</a-badge></div></legend>
                    <div class="form-row" data-bind="capabilities-container"></div>
                </fieldset>
                
                <fieldset>
                    <legend class="w100">Devices <a-badge info data-bind="devices-count">0</a-badge> <div>Selected <a-badge success data-bind="devices-selected-count">0</a-badge></div></legend>
                    <div class="form-row" data-bind="devices-container"></div>
                </fieldset>
                
                <fieldset>
                    <legend class="w100">Areas <a-badge info data-bind="areas-count">0</a-badge> <div>Selected <a-badge success data-bind="areas-selected-count">0</a-badge></div></legend>
                    <div class="form-row" data-bind="areas-container"></div>
                </fieldset>

                <fieldset>
                    <div class="form-row" data-bind="buttons-container">
                        <a-button name="reset" aria-label="Limpiar">Limpiar</a-button> <a-button success type="submit" name="save" aria-label="Guardar"><an-icon save></an-icon> Save</a-button>
                    </div>
                </fieldset>
            </form>
        </a-dialog>
    </body>
    <script src="./js/script.js"></script>
